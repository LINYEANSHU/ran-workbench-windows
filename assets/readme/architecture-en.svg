<text x="978" y="603" font-size="18" fill="#64746c" font-weight="400" text-anchor="start">Mitsuba · Dr.Jit</text>
</g>
<g id="meshes">
<title>Local model files: .city.json + meshes</title>
<rect x="660" y="580" width="200" height="106" rx="12" fill="#ffffff" stroke="#c9d3cb"/>
<path d="M678 603h18" stroke="#64746c" stroke-width="3"/>
<text x="678" y="630" font-size="22" fill="#172820" font-weight="600" text-anchor="start">Local model files</text>
<text x="678" y="653" font-size="18" fill="#64746c" font-weight="400" text-anchor="start">.city.json + meshes</text>
