<path d="M550 633H660" fill="none" stroke="#64746c" stroke-width="2" marker-end="url(#arrow-64746c)"/>
<text x="605" y="617" font-size="18" fill="#64746c" font-weight="400" text-anchor="middle">read only</text>
</g>
