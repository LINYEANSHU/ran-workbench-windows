<text x="48" y="730" font-size="21" fill="#172820" font-weight="400" text-anchor="start">RT requires CUDA. Synthetic Strategy mode is explicitly selected.</text>
<text x="48" y="762" font-size="20" fill="#64746c" font-weight="400" text-anchor="start">Modeling meshes are never passed to the propagation solver.</text>
</g>
</svg>
