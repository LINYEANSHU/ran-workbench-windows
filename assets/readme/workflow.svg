<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title desc">
<title id="title">RAN Workbench workspace boundaries</title>
<desc id="desc">Modeling inspects user-supplied meshes separately. Workbench sends a scene copy to Strategy for NR experiments.</desc>
