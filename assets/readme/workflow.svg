<text x="402" y="109" font-size="32" font-weight="600">Workbench</text>
<text x="402" y="148" font-size="22" fill="#bdc7c1">Scene + propagation</text>
<path d="M736 112h79m-13-9 13 9-13 9" fill="none" stroke="#9fc7b8" stroke-width="3"/>
<text x="735" y="148" font-size="18" fill="#9fc7b8">scene copy</text>
<text x="869" y="109" font-size="32" font-weight="600">Strategy</text>
